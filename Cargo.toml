[package]
name = "edot"
version = "0.1.0"
edition = "2024"

[dependencies]
regex-lite = "0.1.9"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_Security", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_StationsAndDesktops"] }
