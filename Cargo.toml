[package]
name = "edot"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8" }
unicode-segmentation = "1.12"
regex-lite = "0.1.9"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Security"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8", features = ["test-support"] }

[profile.dev]
debug = 0

[profile.release]
strip = "symbols"
