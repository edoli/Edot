[package]
name = "edot"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { git = "https://github.com/edoli/zed.git", rev = "d910aecc63523831fd947ea0f631d91604e02963", default-features = false, features = ["windows-manifest"] }
gpui_platform = { git = "https://github.com/edoli/zed.git", rev = "d910aecc63523831fd947ea0f631d91604e02963", default-features = false }
unicode-segmentation = "1.12"
regex-lite = "0.1.9"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
gpui = { git = "https://github.com/edoli/zed.git", rev = "d910aecc63523831fd947ea0f631d91604e02963", default-features = false, features = ["test-support"] }

[build-dependencies]
embed-resource = "=3.0.11"

[profile.dev]
debug = 0

[profile.release]
strip = "symbols"
